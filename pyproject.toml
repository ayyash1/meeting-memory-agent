[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetingmind"
version = "0.1.0"
description = "Evidence-grounded meeting memory for the AMI meeting corpus"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0"]

[project.scripts]
meetingmind = "meetingmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
